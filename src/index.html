<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Echo AI</title>
<style>
  /* CSS Variables for high contrast and performance */
  :root { 
    --bg: #05060a; 
    --fg: #ffffff; 
    --ok: #00ff00; 
    --warn: #ffff00; 
    --err: #ff4444; 
    --focus: #ffff00; 
  }

  /* Base resets for performance */
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  
  /* Prevent black screen: body background matches splash */
  html, body { 
    background-color: var(--bg); 
    color: var(--fg); 
    font: 18px/1.5 monospace; 
    min-height: 100vh; 
    cursor: pointer; 
    overflow: hidden; 
  }
  body { padding: 16px; display: flex; flex-direction: column; }

  /* TalkBack accessible skip link */
  .skip-link { position: absolute; left: -999px; top: 0; background: var(--focus); color: #000; padding: 10px; z-index: 9; }
  .skip-link:focus { left: 16px; top: 16px; }

  /* Screen reader only class */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  /* Typography */
  h1 { font-size: 2rem; color: var(--ok); letter-spacing: 0.05em; text-align: center; margin-top: 10px; }
  h2 { font-size: 1.1rem; color: var(--warn); margin: 20px 0 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  
  /* Status Display */
  #status { font-size: 1.5rem; font-weight: 700; color: var(--ok); text-align: center; margin: 20px 0; min-height: 2em; }
  #transcript { color: var(--warn); text-align: center; font-style: italic; margin-bottom: 10px; min-height: 1.5em; }
  #answer { white-space: pre-wrap; word-break: break-word; margin-top: 10px; flex-grow: 1; overflow-y: auto; color: var(--fg); }
  
  /* Layout Panels */
  .panel { border: 1px solid #333; border-radius: 6px; padding: 12px; margin-top: 16px; }
  .dim { color: #aaaaaa; font-size: 0.9rem; }
  
  /* Invisible full-screen overlay to catch all taps */
  #clickOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999; }

  /* --- SPLASH SCREEN & ANIMATION --- */
  #splashScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: var(--bg); z-index: 10000;
    display: flex; justify-content: center; align-items: center;
    transition: opacity 0.8s ease-out, visibility 0.8s;
  }

  #splashImg {
    width: 60vw; max-width: 300px; border-radius: 20px;
    animation: pulseGlow 2s infinite alternate;
  }

  /* Unique scale & fade out animation */
  @keyframes splashExit {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.15); }
  }

  #splashScreen.hidden {
    animation: splashExit 0.8s ease-in-out forwards;
    pointer-events: none;
  }

  @keyframes pulseGlow {
    0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(0, 255, 213, 0.2)); }
    100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(0, 255, 213, 0.6)); }
  }

  /* Respect reduced motion preferences */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    #splashScreen.hidden { opacity: 0; visibility: hidden; }
  }
</style>
</head>
<body>
  <!-- SPLASH SCREEN -->
  <div id="splashScreen" aria-hidden="true">
    <!-- Make sure splash.png is copied into the www/ folder -->
    <img src="splash.png" alt="" id="splashImg">
  </div>

  <!-- Skip link for TalkBack -->
  <a href="#clickOverlay" class="skip-link">Activate microphone</a>
  
  <header>
    <h1>Echo AI</h1>
  </header>

  <main>
    <section class="panel" aria-labelledby="sH">
      <h2 id="sH">Status</h2>
      <p id="status" role="status" aria-live="polite" aria-atomic="true">Tap anywhere to speak</p>
      <p id="transcript" aria-live="polite" aria-atomic="true"></p>
      <div id="answer" aria-live="polite" aria-atomic="true"></div>
    </section>
  </main>

  <!-- Hidden Live Regions for TalkBack Announcements -->
  <div id="lp" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="la" class="sr-only" role="alert" aria-live="assertive" aria-atomic="true"></div>

  <!-- Full Screen Click Overlay -->
  <div id="clickOverlay" aria-label="Speak to Echo AI" role="button" tabindex="0"></div>

  <script src="app.js"></script>
</body>
</html>
